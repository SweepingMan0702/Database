  <button onclick="showRecord(currentRecord - 1)">上一筆</button>

    <!-- 新增資料的小視窗 -->
    <div id="modal">
      <form method="PUT" action="/fruit" onsubmit="addfruit(event)">
        <label for="ID">Fruit ID:</label><br>

      <button type="submit">更新</button>

  <script>
    //資料顯示
    var currentRecord = 0;
    var fruits = {{ fruits | tojson | safe}}
    console.log(fruits);
    function showRecord(index) {
        var fruit = fruits[index];
        if (fruit) {
            var inputs = document.querySelectorAll('input');
            inputs[0].value = fruit.ID
            inputs[1].value = fruit.F_name;
            inputs[2].value = fruit.Quantity;
            inputs[3].value = fruit.Unit;
            inputs[4].value = fruit.Supplier;
            inputs[5].value = fruit.PurchaseDate;
            inputs[6].value = fruit.PromotionDate;
            inputs[7].value = fruit.Cost;
            inputs[8].value = fruit.TotalValue;
            currentRecord = index; // Update the current record index
        }
    }

    showRecord(currentRecord);

        //新增的按鈕
  function openModal() {
    document.getElementById('modal').style.display = 'block';
  }
  function closeModal() {
    document.getElementById('modal').style.display = 'none';
  }

        //新增水果資料
  function addfruit(event){
    event.preventDefault();
    const ID = document.getElementById('ID').value;
    const F_name = document.getElementById('F_name').value;
    const Supplier = document.getElementById('Supplier').value;
    const Quantity = document.getElementById('Quantity').value;
    const Unit = document.getElementById('Unit').value;
    const Cost = document.getElementById('Cost').value;
    const TotalValue = document.getElementById('TotalValue').value;
    const Location = document.getElementById('Location').value;
    const PurchaseDate = document.getElementById('PurchaseDate').value;
    const PromotionDate = document.getElementById('PromotionDate').value;
    const Expiry = document.getElementById('Expiry').value;
    fetch('/fruit',{method: 'POST',
      headers: {'Content-Type': 'application/json',},
      body: JSON.stringify({ID, F_name, Supplier, Quantity:Number(Quantity) , Unit, Cost, TotalValue, Location, PurchaseDate, PromotionDate, Expiry}),
    })
    .then(response => {
              if (response.ok) {
                  location.reload();
                  location.reload();
                  location.reload();
              }   
              else {
                  console.error('Failed to delete user');
              }
    })
  }
  
  //刪除按鈕
  function deleteRecord() {
    if (fruits && fruits.length > 0) {
        var ID = fruits[currentRecord].ID;
        console.log(ID);
        alert("執行刪除操作");

        fetch(`/fruit/${ID}`, { method: 'DELETE' })
          .then(response => {
            if (response.ok) {
              location.reload();
              location.reload();
              location.reload();
                }   
                else {
                    console.error('Failed to delete user');
                }
      })}}

    }
  </script>
