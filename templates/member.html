  <script>


  
    //資料顯示 
    var currentRecord = 0;
    var members = {{ members | tojson | safe}}
    console.log(members);
    function showRecord(index) {
        var member = members[index];
        if (member) {
            var inputs = document.querySelectorAll('input');
            inputs[0].value = member.MemberID
            inputs[1].value = member.Name;
            inputs[2].value = member.Phone;
            inputs[3].value = member.Email;
            inputs[4].value = member.Address;
            inputs[5].value = member.Discount;
            currentRecord = index; // Update the current record index
        }
    }

    showRecord(currentRecord);

//資料查詢
      function searchRecord(id) {
        console.log(id);
        fetch(`/member/${id}`),{}
    }

//刪除按鈕
    function deleteRecord() {
      if (members && members.length > 0) {
        var memberId = members[currentRecord].MemberID; // 使用當前索引處的 MemberID
        console.log(memberId);
        alert("執行刪除操作");

        fetch(`/member/${memberId}`, { method: 'DELETE' })
          .then(response => {
            if (response.ok) {
              location.reload();
              location.reload();
              location.reload();
                }   
                else {
                    console.error('Failed to delete user');
                }
      })}}


      //新增會員
      function addmember(event){
      event.preventDefault();
      const MemberID = document.getElementById('MemberID').value;
      const Name = document.getElementById('Name').value;
      const Phone = document.getElementById('Phone').value;
      const Mobile = document.getElementById('Mobile').value;
      const Email = document.getElementById('Email').value;
      const LineStatus = document.getElementById('LineStatus').checked;
      const Address = document.getElementById('Address').value;
      const Age = document.getElementById('Age').value;
      const Photo = document.getElementById('Photo').value; // 注意：這裡獲取的是文件名，而不是實際的文件內容
      const Discount = document.getElementById('Discount').value;
      fetch('/member',{method: 'POST',
        headers: {'Content-Type': 'application/json',},
        body: JSON.stringify({MemberID, Name, Phone, Mobile, Email, LineStatus, Address, Age: Number(Age), Photo, Discount}),
      })
      .then(response => {
                if (response.ok) {
                    location.reload();
                    location.reload();
                    location.reload();
                }   
                else {
                    console.error('Failed to delete user');
                }
      })
    }
    
    //新增的按鈕
    function openModal() {
      document.getElementById('modal').style.display = 'block';
    }
  function closeModal() {
    document.getElementById('modal').style.display = 'none';
  }

};
