<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit List</title>
</head>
<body>
    <h1>Fruit List8926</h1>
    
    <ul id="fruitList">
        {% for fruit in fruits %}
            <li>{{ fruit.ID }} - {{ fruit.F_name}}</li>
        {% endfor %}
    </ul>

    <form method="POST" action="/fruit" onsubmit="addFruit(event)">
        <label for="id">水果編號：</label>
        <input type="text" id="id" name="id" required>
        <label for="F_name">水果名稱：</label>
        <input type="text" id="F_name" name="F_name" required>
        <label for="Quantity">數量：</label>
        <input type="number" id="Quantity" name="Quantity" required>
        <label for="Unit">單位：</label>
        <input type="text" id="Unit" name="Unit" required>
        <label for="Cost">成本：</label>
        <input type="number" id="Cost" name="Cost" step="0.01" required>
        <label for="TotalValue">總價值：</label>
        <input type="number" id="TotalValue" name="TotalValue" step="0.01" required>
        <button type="submit">添加水果</button>
    </form>

    <h1>Fruit List</h1>
    
    <ul id="userList">
        {% for fruit in fruits %}
            <li>
                {{ fruit.ID }} - {{ fruit.F_name}}
                <button onclick="deleteUser('{{ fruit.id }}')">Delete</button>
            </li>
        {% endfor %}
    </ul>

  <button onclick = "reset()">刷新清單</button>
</body>

  <script>
        function addUser(event) {
          event.preventDefault();
          const id = document.getElementById('id').value;
          const F_name = document.getElementById('F_name').value;
          const Supplier = document.getElementById('Supplier').value;
          const Quantity = document.getElementById('Quantity').value;
          const Unit = document.getElementById('Unit').value;
          const Cost = document.getElementById('Cost').value;
          const TotalValue = document.getElementById('TotalValue').value;
          const Location = document.getElementById('Location').value;
          const PurchaseDate = document.getElementById('PurchaseDate').value;
          const PromotionDate = document.getElementById('PromotionDate').value;
          const Expiry = document.getElementById('Expiry').value;

          
          fetch('/user', {method: 'POST',
              headers: {'Content-Type': 'application/json',},
              body: JSON.stringify({ id, F_name, Supplier, Quantity, Unit, Cost, TotalValue}),
          })
          .then(response => {
                if (response.ok) {
                    location.reload();
                    location.reload();
                    location.reload();
                }   
                else {
                    console.error('Failed to delete user');
                }
      })}

      function deleteUser(userId) {
            // 使用 JavaScript 發送 DELETE 請求
            fetch(`/user/${userId}`, {method: 'DELETE',})
            .then(response => {
                if (response.ok) {
                    location.reload();
                    location.reload();
                    location.reload();
                }   
                else {
                    console.error('Failed to delete user');
                }
      })}

      function reset(){
        location.reload();
      }

  </script>
  
  

</html>
