<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Records</title>
</head>
<body>
    <h1>Member Recordsasdasd</h1>

    <!-- Input fields for member information -->
    <label for="MemberID">Member ID:</label>
    <input type="text" id="MemberID" readonly>

    <label for="name">Name:</label>
    <input type="text" id="name" readonly>

    <label for="phone">Phone:</label>
    <input type="text" id="phone" readonly>

    <label for="email">Email:</label>
    <input type="text" id="email" readonly>

    <label for="address">Address:</label>
    <input type="text" id="address" readonly>

    <label for="discount">Discount:</label>
    <input type="text" id="discount" readonly>

    <!-- Buttons for navigating records -->
    <button onclick="showRecord(currentRecord - 1)">Previous</button>
    <button onclick="showRecord(currentRecord + 1)">Next</button>

    <script>
        // Your existing script goes here
        var currentRecord = 0;
        var members = {{ members|tojson|safe }};

        function showRecord(index) {
            // Your existing showRecord function goes here
            var member = members[index];
            if (member) {
                var inputs = document.querySelectorAll('input');
                inputs[0].value = member.MemberID
                inputs[1].value = member.Name;
                inputs[2].value = member.Phone;
                inputs[3].value = member.Email;
                inputs[4].value = member.Address;
                inputs[5].value = member.Discount;
                currentRecord = index; // Update the current record index
            }
        }
        showRecord(currentRecord);
    </script>

</body>
</html>
