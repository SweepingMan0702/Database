<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>供應商資料表</title>
  <style>
    table {
      border-collapse: collapse;
      width: 50%;
    }
    td {
      border: none;
      padding: 8px;
      text-align: center;
    }
    label {
      position: relative;
      left: 13.5cm;
      top: 1cm;
      margin-bottom: 0.8cm;
    }
    input {
      width: 300px;
      height: 25px;
      margin-bottom: 0.7cm;
      position: relative;
      left: 9.5cm;
      top: 1.3cm;
    }
    button {
      margin-top: 75px;
      margin-left: 0.6cm;
      position: relative;
      left: 14.7cm;
      color: rgb(105, 103, 103);
      border: none;
      padding: 9px; /* 新增 padding 屬性 */
      font-size: 15px; /* 新增 font-size 屬性 */
    }
    button.goBack {
        margin-left: -270px; /* 移動左邊距 */
       /* 調整左邊距 */
      top:85px;
    }
    button.blue {
      background-color: #6eb5efaa;
      border: none;
    }
    button.red {
      background-color: #f19c969f;
      border: none;
    }
    button.green {
      background-color: #98f39ba0;
      border: none;
    }
    /* ... 您現有的樣式 ... */
    /* 模態框的樣式 */
    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #fff;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      z-index: 2;
    }
  </style>
</head>
<body>

  <table>
    <!-- 第一列 -->
    <tr>
      <td><label for="vendorID">供應商統一編號</label></td>
      <td><input type="text" id="vendorID"></td>
    </tr>
    <!-- 第二列 -->
    <tr>
      <td><label for="vendorName">供應商名稱</label></td>
      <td><input type="text" id="vendorName"></td>
    </tr>
    <!-- 第三列 -->
    <tr>
      <td><label for="phone">電話</label></td>
      <td><input type="text" id="phone"></td>
    </tr>
    <!-- 第四列 -->
    <tr>
      <td><label for="email">Email</label></td>
      <td><input type="text" id="email"></td>
    </tr>
    <!-- 第五列 -->
    <tr>
      <td><label for="contactPerson">負責人姓名</label></td>
      <td><input type="text" id="contactPerson"></td>
    </tr>
    <!-- 第六列 -->
    <tr>
      <td><label for="address">地址</label></td>
      <td><input type="text" id="address"></td>
    </tr>
  </table>

  <button onclick="showRecord(currentRecord - 1)">上一筆</button>
  <button onclick="showRecord(currentRecord + 1)">下一筆</button>
  <button onclick="openModal()" class="blue">新增</button>
  <button onclick="deleteRecord()" class="red">刪除</button>
  <button onclick="searchRecord()">查詢</button>
  <button onclick="updateRecord()" class="green">修改</button>
  <button onclick="goBack()" class="goBack">返回查詢頁面</button>

  <!-- 模態框的HTML結構 -->
  <div id="myModal" class="modal">
    <p>請輸入供應商資料:</p>
    <form method="PUT" action="/supplier" onsubmit="addsupplier(event)">
    <td>
    <label for="ID" style="position: relative; left: -0.2cm;top: 1.5cm;">供應商統一編號</label>
    <input type="text" id="ID" name="ID" style="width: 250px; height: 25px; margin-bottom: 0.7cm; position: relative; left: 0.3cm; top: 1.5cm;"><br>
</td>
<td>
    <label for="Name" style="position: relative; left: 0cm;top: 1.5cm;">供應商名稱</label>
    <input type="text" id="Name" name="Name"  style="width: 250px; height: 25px; margin-bottom: 0.7cm; position: relative; left: 1cm; top: 1.5cm;"><br>
</td>
<td>
    <label for="Phone" style="position: relative; left: 0.8cm;top: 1.5cm;">電話</label>
    <input type="text" id="Phone" name="Phone" style="width: 250px; height: 25px; margin-bottom: 0.7cm; position: relative; left: 2cm; top: 1.5cm;"><br>
</td>
<td>
    <label for="Email" style="position: relative; left: 0.8cm;top: 1.5cm;">Email</label>
    <input type="text" id="Email" name="Email" style="width: 250px; height: 25px; margin-bottom: 0.7cm; position: relative; left: 2cm; top: 1.5cm;"><br>
</td>
<td>
    <label for="Agent"style="position: relative; left: 0cm;top: 1.5cm;">負責人姓名</label>
    <input type="text" id="Agent" name="Agent" style="width: 250px; height: 25px; margin-bottom: 0.7cm; position: relative; left: 1cm; top: 1.5cm;"><br>
</td>
<td>
    <label for="Address" style="position: relative; left: 0.8cm;top: 1.5cm;">地址</label>
    <input type="text" id="Address" name="Address" style="width: 250px; height: 25px; margin-bottom: 0.7cm; position: relative; left: 2cm; top: 1.5cm;"><br>
</td>
    <button type="submit" class="blue"style="position: relative; left: 2.5cm;top: -0.5cm;">儲存</button>
    <button onclick="closeModal()"style="position: relative; left: 3.5cm;top: -0.5cm;">取消</button>
  </form>
  </div>

  <script>

    //資料顯示 
    var currentRecord = 0;
    var suppliers = {{ suppliers | tojson | safe}}
    console.log(suppliers);
    function showRecord(index) {
        var supplier = suppliers[index];
        if (supplier) {
            var inputs = document.querySelectorAll('input');
            inputs[0].value = supplier.ID
            inputs[1].value = supplier.Name;
            inputs[2].value = supplier.Phone;
            inputs[3].value = supplier.Email;
            inputs[4].value = supplier.Address;
            inputs[5].value = supplier.Agent;
            currentRecord = index; // Update the current record index
        }
    }

    showRecord(currentRecord);

    //新增供應商
      function addsupplier(event){
      event.preventDefault();
      const ID = document.getElementById('ID').value;
      const Name = document.getElementById('Name').value;
      const Phone = document.getElementById('Phone').value;
      const Email = document.getElementById('Email').value;
      const Address = document.getElementById('Address').value;
      const Agent = document.getElementById('Agent').value;
      fetch('/supplier',{method: 'POST',
        headers: {'Content-Type': 'application/json',},
        body: JSON.stringify({ID, Name, Phone, Email, Address, Agent}),
      })
      .then(response => {
                if (response.ok) {
                    location.reload();
                    location.reload();
                    location.reload();
                }   
                else {
                    console.error('Failed to delete user');
                }
      })
    }
    //新增的按鈕
  function openModal() {
    document.getElementById('myModal').style.display = 'block';
  }
  function closeModal() {
    document.getElementById('modal').style.display = 'none';
  }


//刪除按鈕
function deleteRecord() {
      if (suppliers && suppliers.length > 0) {
        var ID = suppliers[currentRecord].ID;
        console.log(ID);
        alert("執行刪除操作");

        fetch(`/supplier/${ID}`, { method: 'DELETE' })
          .then(response => {
            if (response.ok) {
              location.reload();
              location.reload();
              location.reload();
                }   
                else {
                    console.error('Failed to delete user');
                }
      })}}





    function searchRecord() {
      alert("執行查詢操作");
    }

    function updateRecord() {
      alert("執行修改操作");
    }


    function goBack() {
      window.location.href = "file:///C:/Users/User/OneDrive/%E6%A1%8C%E9%9D%A2/HTML/database/choose.html";
    }
  </script>

</body>
</html>
